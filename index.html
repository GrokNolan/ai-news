<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Pulse • Flashback Latest • 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto+Mono:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#000;
      color:#e0f7ff;
      font-family:'Roboto Mono', monospace;
      min-height:100vh;
      position:relative;
      overflow-x:hidden;
    }
    .dna-bg {
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:1;
      opacity:0.22;
      background:
        radial-gradient(circle at 20% 30%, #00ffff0f 0%, transparent 45%),
        radial-gradient(circle at 80% 70%, #ff00ff0f 0%, transparent 45%),
        repeating-linear-gradient(135deg, transparent 0, transparent 5px, #00ffff06 5px, #00ffff06 10px),
        repeating-linear-gradient(-135deg, transparent 0, transparent 5px, #ff00ff06 5px, #ff00ff06 10px);
      image-rendering:pixelated;
    }
    .glow-particles {
      position:fixed;
      inset:0;
      z-index:2;
      pointer-events:none;
    }
    .content {
      position:relative;
      z-index:10;
      padding:4rem 5vw;
      max-width:1100px;
      margin:0 auto;
    }
    h1 {
      font-family:'Orbitron', sans-serif;
      font-size:clamp(3.5rem,9vw,8rem);
      text-align:center;
      background:linear-gradient(90deg,#00ffff,#ff00ff,#00ffff);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      background-size:200% auto;
      animation:glowFlow 7s linear infinite;
      text-shadow:0 0 50px rgba(0,255,255,0.7);
      margin-bottom:1rem;
    }
    .subtitle { text-align:center; font-size:1.4rem; opacity:0.7; margin-bottom:3.5rem; letter-spacing:1.5px; }
    .grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
      gap:2rem;
    }
    .card {
      background:rgba(8,12,25,0.6);
      backdrop-filter:blur(10px);
      border:1px solid rgba(0,255,255,0.16);
      border-radius:14px;
      padding:1.6rem;
      transition:all 0.3s ease;
      position:relative;
      overflow:hidden;
    }
    .card:hover {
      transform:translateY(-6px);
      border-color:rgba(0,255,255,0.4);
      box-shadow:0 0 35px rgba(0,255,255,0.22);
    }
    .news-title { color:#00ffff; font-size:1.3rem; margin-bottom:0.7rem; }
    .post-title a { color:#e0ffff; text-decoration:none; }
    .post-title a:hover { color:#00ffff; text-decoration:underline; }
    .meta { margin-top:0.8rem; font-size:0.9rem; opacity:0.65; text-align:right; }
    .error-card { background:rgba(100,0,0,0.3); border-color:#ff4444; }
    @keyframes glowFlow { 0%{background-position:0% 50%;} 100%{background-position:200% 50%;} }
    @media (max-width:600px) { .content { padding:3rem 6vw; } h1 { font-size:clamp(3rem,11vw,6rem); } }
  </style>
</head>
<body>

  <div class="dna-bg"></div>
  <div class="glow-particles"></div>

  <div class="content">
    <h1>AI PULSE</h1>
    <div class="subtitle">Today's AI + Flashback Latest • Jan 09, 2026</div>

    <div class="grid">

      <!-- Static AI content example cards -->
      <div class="card">
        <div class="news-title">AI Hot Quote</div>
        <div class="post-title" style="font-size:1.1rem;line-height:1.5;">
          "We don't count parameters anymore — we count useful thoughts per joule."
        </div>
        <div class="meta">— Frontier lab researcher, early 2026</div>
      </div>

      <!-- Dynamic Flashback Latest Posts -->
      <div class="card" id="flashback-loading">
        <div class="news-title">Senaste från Flashback</div>
        <div style="opacity:0.7;">Laddar senaste inläggen...</div>
      </div>

    </div>
  </div>

  <!-- Floating glowing pixels -->
  <script>
    const particles = document.querySelector('.glow-particles');
    for(let i=0;i<50;i++){
      const p=document.createElement('div');
      p.style.cssText=`
        position:absolute; width:${Math.random()*3+1}px; height:${Math.random()*3+1}px;
        background:${Math.random()>0.5?'#00ffff':'#ff00ff'}; border-radius:50%;
        left:${Math.random()*100}%; top:${Math.random()*100}%;
        opacity:${Math.random()*0.35+0.08};
        box-shadow:0 0 ${Math.random()*18+8}px currentColor;
        animation:float ${18+Math.random()*25}s infinite linear;
      `;
      particles.appendChild(p);
    }
  </script>

  <!-- Fetch Flashback latest posts -->
  <script>
    const proxy = 'https://api.allorigins.win/raw?url=';
    const targetUrl = 'https://www.flashback.org/';

    async function loadFlashback() {
      const container = document.getElementById('flashback-loading');
      try {
        const res = await fetch(proxy + encodeURIComponent(targetUrl));
        if (!res.ok) throw new Error('Fetch failed');
        const html = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // Find forum tables - Flashback uses multiple <table class="table"> but latest are in td with "Senast"
        const candidates = doc.querySelectorAll('td');
        const posts = [];

        candidates.forEach(td => {
          if (td.textContent.includes('Idag') || td.textContent.includes('igår')) {
            const row = td.closest('tr');
            if (!row) return;
            const cells = row.querySelectorAll('td');
            if (cells.length < 4) return;

            const forumCell = cells[0];
            const threadCell = cells[1];
            const lastPostCell = cells[3] || td;

            const link = threadCell?.querySelector('a');
            if (!link) return;

            posts.push({
              title: link.textContent.trim(),
              url: 'https://www.flashback.org' + link.getAttribute('href'),
              forum: forumCell?.querySelector('a')?.textContent.trim() || 'Forum',
              time: lastPostCell.textContent.trim().replace(/\s+/g,' ').slice(0,20)
            });
          }
        });

        // Dedupe + take newest (roughly first found are recent)
        const uniquePosts = [...new Map(posts.map(p => [p.url, p])).values()].slice(0,6);

        if (uniquePosts.length === 0) throw new Error('No posts parsed');

        container.innerHTML = `
          <div class="news-title">Senaste från Flashback</div>
          ${uniquePosts.map(p => `
            <div style="margin:1rem 0;">
              <div class="post-title"><a href="${p.url}" target="_blank">${p.title}</a></div>
              <div class="meta">${p.forum} • ${p.time}</div>
            </div>
          `).join('')}
          <div style="margin-top:1rem;font-size:0.85rem;opacity:0.6;text-align:center;">
            Uppdateras vid sidomladdning • Proxy via allorigins
          </div>
        `;
      } catch (err) {
        console.error(err);
        container.classList.add('error-card');
        container.innerHTML = `
          <div class="news-title">Kunde inte hämta Flashback</div>
          <div style="opacity:0.8;">Flashback blockerar troligen eller sidan ändrades.<br>Försök ladda om eller senare.</div>
          <div style="margin-top:1rem;font-size:0.9rem;opacity:0.6;">(Scraping är skört – de gillar inte bots)</div>
        `;
      }
    }

    // Run once on load
    loadFlashback();

    // Optional: refresh every 10 minutes
    // setInterval(loadFlashback, 10*60*1000);
  </script>

  <style>
    @keyframes float {
      0%,100%{transform:translateY(0) translateX(0);}
      50%{transform:translateY(-70vh) translateX(${Math.random()*30-15}vw);}
    }
  </style>

</body>
</html>
